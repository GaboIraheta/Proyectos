<section class="registro" id="registro">
  <div class="registro-container">
    <h2 class="registro-title">Crear cuenta</h2>
    <p class="registro-subtitle">Únete a <span class="highlight">Mini Súper El Ahorro</span></p>

    <form class="registro-form" id="registro-form">
      <div class="registro-field">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required />
      </div>

      <div class="registro-field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required />
      </div>

      <div class="registro-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>

      <div class="registro-field">
        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" name="confirmar" placeholder="Repite tu contraseña" required />
      </div>

      <button type="submit" class="btn registro-btn">Registrarse</button>
    </form>

    <div class="error-message">
      <p id="error-text"></p>
    </div>
    
    <div class="registro-footer">
      <p>¿Ya tienes cuenta? <a data-link href="/login">Inicia sesión</a></p>
    </div>
  </div>
</section>
