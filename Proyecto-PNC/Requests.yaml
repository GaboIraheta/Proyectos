              schema:
                type: string
                enum:
                  - NEAREST_EXIT
                  - AISLE_FILL
                  - ZONE_BASED
                  - SEASONAL_PROXIMITY
                  - RANDOM
          responses:
            "200":
              description: OK
              content:
                "*/*":
                  schema:
                    $ref: "#/components/schemas/GeneralResponse"
